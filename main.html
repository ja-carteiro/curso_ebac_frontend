<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
    <style>
        body {
            margin-top: 200px;
            background-color: ivory;
        }

        .form {
            width: 100%;
            margin: auto;
            max-width: 400px;
        }

        .btn {
            width: 400px;
            margin-top: 10px;
        }

        .form-check {
            margin-top: 10px;
        }

        a {
            text-decoration: none;
            color: rgb(255, 184, 103);
        }
    </style>
</head>
<body>
    <div class="container">
        <form class="form">
            <label for="campo-nome">Nome:</label>
            <input id="campo-nome" type="text" class="form-control" placeholder="Seu nome">
            <label for="campo-email">E-mail:</label>
            <input id="campo-email" type="email" class="form-control" placeholder="exemplo@exemplo.com">
            <label for="campo-tel">Telefone:</label>
            <input id="campo-tel" type="tel" class="form-control" placeholder="(00) 00000-0000">
            <div class="form-check form-switch">
                <label for="switch">Li e concordo com os <a href="#">Termos de Uso</a></label>
                <input id="switch" class="form-check-input" type="checkbox">
            </div>
            <button class="btn btn-success">
                Enviar
            </button>
        </form>
    </div>
</body>
</html>
